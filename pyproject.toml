[project]
name = "support-triage-agent"
version = "0.1.0"
description = "SaaS support-ticket triage + RAG auto-reply agent in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "pgvector",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "openai",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
